<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つくば研究学園 学びの予定</title>
<style>
/* 月ごとの縦の予定表。左に日付、右にその日の予定。やめた予定は斜線のまま残す */
*, *::before, *::after {
  box-sizing: border-box;
}

:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #1c2430;
  --muted: #536070;
  --line: #d8dee7;
  --accent: #1958a0;
  --sat: #1958a0;
  --sun: #c03333;
  --past: #7e8b9b;
  --cat-ort: #3f44b0;   --cat-ort-bg: #eaedfc;
  --cat-ai: #9c5500;    --cat-ai-bg: #fff1da;
  --cat-safe: #19733e;  --cat-safe-bg: #e0f4e8;
  --cat-kouza: #1958a0; --cat-kouza-bg: #e1eefb;
  --cat-dead: #ab1f1f;  --cat-dead-bg: #fde6e6;
  --cat-mile: #723696;  --cat-mile-bg: #f2e5f9;
  --cat-ev: #444f5e;    --cat-ev-bg: #eceff4;
  --check: #855500;     --check-bg: #fff1cc;
  --btn-bg: #1f5fa8;
  --btn-fg: #ffffff;
  --btn-hover: #164b88;
  --btn-border: #1a5293;
  --font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d;
    --surface: #19202a;
    --fg: #e6ebf2;
    --muted: #a3b0c2;
    --line: #2e3948;
    --accent: #82b4ef;
    --sat: #82b4ef;
    --sun: #f28d8d;
    --past: #6d7b8e;
    --cat-ort: #b8baff;   --cat-ort-bg: #262a52;
    --cat-ai: #f5c47e;    --cat-ai-bg: #3c2c15;
    --cat-safe: #8cdba9;  --cat-safe-bg: #173625;
    --cat-kouza: #92bff4; --cat-kouza-bg: #192c43;
    --cat-dead: #f59f9f;  --cat-dead-bg: #3f1b1b;
    --cat-mile: #d9abf2;  --cat-mile-bg: #331e40;
    --cat-ev: #bdc7d4;    --cat-ev-bg: #272f3a;
    --check: #f5d17e;     --check-bg: #3c3013;
    --btn-bg: #2762a8;
    --btn-fg: #ffffff;
    --btn-hover: #3676c6;
    --btn-border: #4a84cb;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #11161d;
  --surface: #19202a;
  --fg: #e6ebf2;
  --muted: #a3b0c2;
  --line: #2e3948;
  --accent: #82b4ef;
  --sat: #82b4ef;
  --sun: #f28d8d;
  --past: #6d7b8e;
  --cat-ort: #b8baff;   --cat-ort-bg: #262a52;
  --cat-ai: #f5c47e;    --cat-ai-bg: #3c2c15;
  --cat-safe: #8cdba9;  --cat-safe-bg: #173625;
  --cat-kouza: #92bff4; --cat-kouza-bg: #192c43;
  --cat-dead: #f59f9f;  --cat-dead-bg: #3f1b1b;
  --cat-mile: #d9abf2;  --cat-mile-bg: #331e40;
  --cat-ev: #bdc7d4;    --cat-ev-bg: #272f3a;
  --check: #f5d17e;     --check-bg: #3c3013;
  --btn-bg: #2762a8;
  --btn-fg: #ffffff;
  --btn-hover: #3676c6;
  --btn-border: #4a84cb;
  color-scheme: dark;
}

html {
  font-size: 16px;
  overflow-x: hidden;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-family);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

.wrap {
  width: 100%;
  max-width: 860px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 56px;
  display: grid;
  gap: 24px;
}

header {
  display: grid;
  gap: 6px;
}

.base {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: .06em;
}

h1 {
  font-family: var(--font-family);
  font-weight: 800;
  font-size: clamp(24px, 5vw, 32px);
  line-height: 1.3;
  margin: 0;
  word-break: break-word;
}

.meta {
  font-size: 13px;
  color: var(--muted);
}

/* フォルダへのリンクボタン */
.links-section {
  display: grid;
  gap: 8px;
}

.links-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.btn-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 10px 16px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  line-height: 1.3;
  text-align: center;
  word-break: break-word;
  transition: background-color .15s ease, opacity .15s ease;
  box-sizing: border-box;
}

.btn-link:hover, .btn-link:focus-visible {
  background: var(--btn-hover);
  text-decoration: underline;
}

.links-note {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}

/* GAS版バッジ */
.gas-badge {
  font-size: 12px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 6px;
  display: inline-block;
  width: fit-content;
}

/* 次の予定 */
.next {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 18px;
  display: grid;
  gap: 6px;
  text-align: left;
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  cursor: pointer;
  width: 100%;
  transition: border-color .15s ease, box-shadow .15s ease;
}

.next:hover, .next:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(25, 88, 160, 0.2);
}

.next-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: .08em;
}

.next-body {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.4;
  word-break: break-word;
}

.next-sub {
  font-size: 14px;
  color: var(--muted);
}

/* 項目ごとの次の日程（箱を並べる） */
.nb { display: grid; gap: 10px; }
.nb-title { font-size: 16px; font-weight: 700; margin: 0; }
.nb-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .nb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .nb-grid { grid-template-columns: minmax(0, 1fr); } }
.nb-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  display: grid;
  gap: 4px;
  align-content: start;
  min-width: 0;
  text-align: left;
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.nb-box:hover, .nb-box:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(25, 88, 160, 0.2);
}
.nb-box .tag { justify-self: start; }
.nb-date { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.nb-time { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nb-name { font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.nb-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nb-box.none .nb-date { font-size: 16px; color: var(--muted); font-weight: 400; }

/* 凡例 */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-size: 13px;
  color: var(--muted);
  align-items: center;
}

.legend .strike-sample {
  text-decoration: line-through;
}

/* 月別セクション */
section.month {
  display: grid;
  gap: 10px;
}

h2 {
  font-family: var(--font-family);
  font-weight: 700;
  font-size: 20px;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

h2 .count {
  font-family: var(--font-family);
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
}

.days {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}

.day {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  border-top: 1px solid var(--line);
}

.day:first-child {
  border-top: none;
}

.date {
  padding: 12px 4px 12px 14px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 17px;
  line-height: 1.3;
}

.date .wd {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.day.sat .wd {
  color: var(--sat);
}

.day.sun .wd {
  color: var(--sun);
}

.day.today {
  box-shadow: inset 4px 0 0 var(--accent);
  background-color: rgba(25, 88, 160, 0.04);
}

.day.today .date::after {
  content: "今日";
  display: inline-block;
  margin-top: 4px;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
}

.day.past {
  color: var(--past);
}

.day.past .wd {
  color: var(--past);
}

.day.past .what .title {
  color: var(--past);
}

.day.past .time {
  color: var(--past);
}

.day.past .tag {
  color: var(--past);
  background: transparent;
  border: 1px solid var(--line);
}

.events {
  list-style: none;
  margin: 0;
  padding: 10px 14px 10px 4px;
  display: grid;
  gap: 10px;
  min-width: 0;
}

.ev-item {
  list-style: none;
  min-width: 0;
}

.ev {
  display: grid;
  grid-template-columns: 8em minmax(0, 1fr);
  gap: 2px 10px;
  align-items: baseline;
  min-width: 0;
  text-align: left;
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 4px 6px;
  cursor: pointer;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  transition: background-color .15s ease, border-color .15s ease;
}

.ev:hover, .ev:focus-visible {
  background: rgba(25, 88, 160, 0.06);
  border-color: var(--line);
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.ev .tag {
  justify-self: start;
}

.tag {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}

.t-ort { color: var(--cat-ort); background: var(--cat-ort-bg); }
.t-ai { color: var(--cat-ai); background: var(--cat-ai-bg); }
.t-safe { color: var(--cat-safe); background: var(--cat-safe-bg); }
.t-kouza { color: var(--cat-kouza); background: var(--cat-kouza-bg); }
.t-dead { color: var(--cat-dead); background: var(--cat-dead-bg); }
.t-mile { color: var(--cat-mile); background: var(--cat-mile-bg); }
.t-ev { color: var(--cat-ev); background: var(--cat-ev-bg); }

.what {
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.time {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 15px;
  margin-right: 6px;
}

.title {
  font-size: 16px;
  line-height: 1.45;
}

.check, .check-sample {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  color: var(--check);
  background: var(--check-bg);
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
}

.check {
  margin-left: 6px;
}

.ev.omitted .what .title, .ev.omitted .time {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  color: var(--muted);
}

.ev.omitted .tag {
  opacity: .55;
}

.reason {
  grid-column: 2;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
  margin-top: 2px;
}

footer {
  font-size: 13px;
  color: var(--muted);
  display: grid;
  gap: 6px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}

footer ul {
  margin: 0;
  padding-left: 1.2em;
}

@media (max-width: 480px) {
  .wrap {
    padding-inline: 12px;
  }
  .links-list {
    flex-direction: column;
  }
  .btn-link {
    width: 100%;
  }
  .day {
    grid-template-columns: 58px minmax(0, 1fr);
  }
  .date {
    padding-left: 8px;
    font-size: 16px;
  }
  .ev {
    grid-template-columns: minmax(0, 1fr);
    gap: 4px;
  }
  .reason {
    grid-column: 1;
  }
}

/* モーダル（詳細の画面） */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
  overflow-x: hidden;
}

.modal-overlay[hidden] {
  display: none !important;
}

.modal-sheet {
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 12px;
  width: 100%;
  max-width: 560px;
  max-height: calc(100vh - 40px);
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
  outline: none;
  overflow: hidden;
}

.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  gap: 12px;
  flex-shrink: 0;
}

.modal-header-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.4;
  margin: 0;
  word-break: break-word;
}

.modal-close-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 6px 14px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  font-family: inherit;
  transition: background-color .15s ease;
}

.modal-close-btn:hover, .modal-close-btn:focus-visible {
  background: var(--line);
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.modal-body {
  padding: 20px;
  overflow-y: auto;
  display: grid;
  gap: 16px;
  font-size: 14px;
  -webkit-overflow-scrolling: touch;
}

.modal-meta {
  display: grid;
  gap: 6px;
}

.modal-date-time {
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.modal-alert {
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.modal-alert-omitted {
  background: rgba(171, 31, 31, 0.08);
  border: 1px solid var(--cat-dead);
  color: var(--cat-dead);
}

.modal-alert-check {
  background: var(--check-bg);
  border: 1px solid var(--check);
  color: var(--check);
}

.modal-section {
  display: grid;
  gap: 8px;
}

.modal-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px;
}

.modal-detail-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.modal-detail-item {
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr);
  gap: 8px;
  font-size: 14px;
  line-height: 1.5;
}

.modal-detail-label {
  font-weight: 700;
  color: var(--muted);
  font-size: 13px;
}

.modal-detail-text {
  word-break: break-word;
  white-space: pre-wrap;
}

.modal-sublist {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.modal-list-btn {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px 12px;
  align-items: baseline;
  width: 100%;
  padding: 10px 12px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--fg);
  font-size: 14px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: border-color .15s ease, background-color .15s ease;
}

.modal-list-btn:hover, .modal-list-btn:focus-visible {
  border-color: var(--accent);
  background: rgba(25, 88, 160, 0.05);
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.modal-list-btn.omitted .modal-btn-title {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  color: var(--muted);
}

/* スマホ用ボトムシート（画面下からせり出す） */
@media (max-width: 600px) {
  .modal-overlay {
    padding: 0;
    align-items: flex-end;
  }
  .modal-sheet {
    max-width: 100%;
    max-height: 85vh;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-left: none;
    border-right: none;
    border-bottom: none;
  }
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ev:hover,
  :root:not([data-theme="light"]) .ev:focus-visible {
    background: rgba(130, 180, 239, 0.12);
  }
  :root:not([data-theme="light"]) .modal-list-btn:hover,
  :root:not([data-theme="light"]) .modal-list-btn:focus-visible {
    background: rgba(130, 180, 239, 0.12);
  }
}
:root[data-theme="dark"] .ev:hover,
:root[data-theme="dark"] .ev:focus-visible {
  background: rgba(130, 180, 239, 0.12);
}
:root[data-theme="dark"] .modal-list-btn:hover,
:root[data-theme="dark"] .modal-list-btn:focus-visible {
  background: rgba(130, 180, 239, 0.12);
}
</style>
</head>
<body>

<div class="wrap">
  <div class="gas-badge" id="gasBadge" hidden>社内向け（pcdepot.jp のアカウントの人だけが見られます）</div>
  <header>
    <div class="base" id="base"></div>
    <h1>学びの予定</h1>
    <div class="meta" id="meta"></div>
  </header>

  <nav class="links-section" aria-label="共有フォルダ">
    <div class="links-list" id="linksList"></div>
    <p class="links-note">※会社のGoogleアカウントで開いてください</p>
  </nav>

  <button type="button" class="next" id="next" hidden>
    <div class="next-label">次の予定</div>
    <div class="next-body" id="nextBody"></div>
    <div class="next-sub" id="nextSub"></div>
  </button>

  <section class="nb" aria-labelledby="nbTitle">
    <h2 class="nb-title" id="nbTitle">項目ごとの次の日程</h2>
    <div class="nb-grid" id="nbGrid"></div>
  </section>

  <div class="legend">
    <span><span class="tag t-ort">オリエン</span> 受講前オリエンテーション</span>
    <span><span class="strike-sample">斜線</span> ＝ やめた予定（理由つき）</span>
    <span><span class="check-sample">確認中</span> ＝ 9月時点の情報。変わっている可能性あり</span>
  </div>

  <div id="months"></div>

  <footer>
    <div>この表に入っていないもの</div>
    <ul id="notIncluded"></ul>
  </footer>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div id="modalSheet" class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-header">
      <div class="modal-header-info">
        <div id="modalTagWrap"></div>
        <h2 id="modalTitle" class="modal-title"></h2>
      </div>
      <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="閉じる">閉じる</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

(function () {

    "オリエン": ["オリエン", "t-ort"],

  };
  const WD = ["日", "月", "火", "水", "木", "金", "土"];

  // URLパラメータ（?today=YYYY-MM-DD）または日本時間の現在日
  const params = new URLSearchParams(window.location.search);
  const today = params.get("today") || new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Tokyo" }).format(new Date());

  document.getElementById("base").textContent = META.base;
  document.getElementById("meta").textContent = "最終更新 " + META.updated.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, "$1年$2月$3日");

  // リンクボタンの描画
  const linksList = document.getElementById("linksList");
  if (linksList && typeof LINKS !== "undefined" && Array.isArray(LINKS)) {
    LINKS.forEach(link => {
      const a = document.createElement("a");
      a.className = "btn-link";
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = link.label;
      linksList.appendChild(a);
    });
  }

  const ni = document.getElementById("notIncluded");
  META.notIncluded.forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    ni.appendChild(li);
  });

  // 日付順・同日内は開始時刻順にソート（nullは末尾）
  const evs = EVENTS.slice().sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    const aStart = a.start || "99:99";
    const bStart = b.start || "99:99";
    if (aStart !== bStart) return aStart.localeCompare(bStart);
    return 0;
  });

  // GAS版の印
  if (typeof VARIANT !== "undefined" && VARIANT === "gas") {
    const gb = document.getElementById("gasBadge");
    if (gb) gb.hidden = false;
  }

  // モーダル管理
  const modalOverlay = document.getElementById("modalOverlay");
  const modalSheet = document.getElementById("modalSheet");
  const modalTagWrap = document.getElementById("modalTagWrap");
  const modalTitle = document.getElementById("modalTitle");
  const modalCloseBtn = document.getElementById("modalCloseBtn");
  const modalBody = document.getElementById("modalBody");
  let lastFocusedElement = null;

  function closeModal() {
    if (!modalOverlay || modalOverlay.hidden) return;
    modalOverlay.hidden = true;
    document.body.style.overflow = "";
    if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
      lastFocusedElement.focus();
    }
  }

  if (modalCloseBtn) {
    modalCloseBtn.addEventListener("click", closeModal);
  }
  if (modalOverlay) {
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });
  }
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalOverlay && !modalOverlay.hidden) {
      closeModal();
    }
  });

  function openModal(triggerEl) {
    if (triggerEl && (!lastFocusedElement || modalOverlay.hidden)) {
      lastFocusedElement = triggerEl;
    }
    modalOverlay.hidden = false;
    document.body.style.overflow = "hidden";
    if (modalCloseBtn) {
      modalCloseBtn.focus();
    }
  }

  function openEventDetail(e, triggerEl) {
    modalTagWrap.replaceChildren();
    modalBody.replaceChildren();

    // 種類の札
    const [label, cls] = TAG[e.category] || [e.category, "t-ev"];
    const tag = document.createElement("span");
    tag.className = "tag " + cls;
    tag.textContent = label;
    modalTagWrap.appendChild(tag);

    // 予定名（タイトル）
    modalTitle.textContent = e.title;

    // 基本情報（日時）
    const metaBox = document.createElement("div");
    metaBox.className = "modal-meta";
    const d = new Date(e.date + "T00:00:00Z");
    const dtDiv = document.createElement("div");
    dtDiv.className = "modal-date-time";
    const dateSpan = document.createElement("span");
    dateSpan.className = "modal-date";
    dateSpan.textContent = (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日（" + WD[d.getUTCDay()] + "）";
    dtDiv.appendChild(dateSpan);
    if (e.start) {
      const timeSpan = document.createElement("span");
      timeSpan.className = "modal-time";
      timeSpan.textContent = e.start + "〜" + (e.end || "");
      dtDiv.appendChild(timeSpan);
    }
    metaBox.appendChild(dtDiv);
    modalBody.appendChild(metaBox);

    // やめた予定なら「やめた予定」と理由
    if (e.omitted) {
      const alertBox = document.createElement("div");
      alertBox.className = "modal-alert modal-alert-omitted";
      const badge = document.createElement("strong");
      badge.textContent = "やめた予定";
      alertBox.appendChild(badge);
      if (e.omitReason) {
        const reasonSpan = document.createElement("span");
        reasonSpan.textContent = "理由：" + e.omitReason;
        alertBox.appendChild(reasonSpan);
      }
      modalBody.appendChild(alertBox);
    }

    // 「確認中」の予定なら印と「9月時点の情報。変わっている可能性あり」
    if (e.check) {
      const alertBox = document.createElement("div");
      alertBox.className = "modal-alert modal-alert-check";
      const checkTag = document.createElement("span");
      checkTag.className = "check";
      checkTag.textContent = "確認中";
      alertBox.appendChild(checkTag);
      const noteSpan = document.createElement("span");
      noteSpan.textContent = "9月時点の情報。変わっている可能性あり";
      alertBox.appendChild(noteSpan);
      modalBody.appendChild(alertBox);
    }

    // detail の各行（見出し：本文）
    if (e.detail && Array.isArray(e.detail) && e.detail.length > 0) {
      const sec = document.createElement("div");
      sec.className = "modal-section";
      const ul = document.createElement("ul");
      ul.className = "modal-detail-list";
      e.detail.forEach(item => {
        const li = document.createElement("li");
        li.className = "modal-detail-item";
        const lb = document.createElement("span");
        lb.className = "modal-detail-label";
        lb.textContent = item.label;
        const tx = document.createElement("span");
        tx.className = "modal-detail-text";
        tx.textContent = item.text;
        li.appendChild(lb);
        li.appendChild(tx);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      modalBody.appendChild(sec);
    }

    // GAS版だけ：internal の各行を「社内向け」という見出しの下に出す
    if (typeof VARIANT !== "undefined" && VARIANT === "gas" && e.internal && Array.isArray(e.internal) && e.internal.length > 0) {
      const sec = document.createElement("div");
      sec.className = "modal-section modal-internal-section";
      const title = document.createElement("div");
      title.className = "modal-section-title";
      title.textContent = "社内向け";
      sec.appendChild(title);
      const ul = document.createElement("ul");
      ul.className = "modal-detail-list";
      e.internal.forEach(item => {
        const li = document.createElement("li");
        li.className = "modal-detail-item";
        const lb = document.createElement("span");
        lb.className = "modal-detail-label";
        lb.textContent = item.label;
        const tx = document.createElement("span");
        tx.className = "modal-detail-text";
        tx.textContent = item.text;
        li.appendChild(lb);
        li.appendChild(tx);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      modalBody.appendChild(sec);
    }

    // 同じ日のほかの予定（押すとその予定の詳細に切り替わる）
    const sameDay = evs.filter(o => o.date === e.date && o !== e);
    if (sameDay.length > 0) {
      const sec = document.createElement("div");
      sec.className = "modal-section";
      const title = document.createElement("div");
      title.className = "modal-section-title";
      title.textContent = "同じ日のほかの予定（" + sameDay.length + "件）";
      sec.appendChild(title);
      const ul = document.createElement("ul");
      ul.className = "modal-sublist";
      sameDay.forEach(o => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "modal-list-btn" + (o.omitted ? " omitted" : "");
        const [oLabel, oCls] = TAG[o.category] || [o.category, "t-ev"];
        const oTag = document.createElement("span");
        oTag.className = "tag " + oCls;
        oTag.textContent = oLabel;
        btn.appendChild(oTag);

        const w = document.createElement("div");
        w.style.minWidth = "0";
        if (o.start) {
          const tm = document.createElement("span");
          tm.className = "time";
          tm.textContent = o.start + "〜" + (o.end || "");
          w.appendChild(tm);
        }
        const tit = document.createElement("span");
        tit.className = "modal-btn-title";
        tit.textContent = o.title;
        w.appendChild(tit);
        if (o.check) {
          const chk = document.createElement("span");
          chk.className = "check";
          chk.textContent = "確認中";
          w.appendChild(chk);
        }
        if (o.omitted && o.omitReason) {
          const r = document.createElement("div");
          r.className = "reason";
          r.textContent = "やめた理由：" + o.omitReason;
          w.appendChild(r);
        }
        btn.appendChild(w);

        btn.addEventListener("click", () => {
          openEventDetail(o, triggerEl);
        });
        li.appendChild(btn);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      modalBody.appendChild(sec);
    }

    openModal(triggerEl);
  }

  function openCategoryDetail(cat, triggerEl) {
    modalTagWrap.replaceChildren();
    modalBody.replaceChildren();

    // 種類の札
    const [label, cls] = TAG[cat] || [cat, "t-ev"];
    const tag = document.createElement("span");
    tag.className = "tag " + cls;
    tag.textContent = label;
    modalTagWrap.appendChild(tag);

    // 項目の名前
    modalTitle.textContent = cat;

    // CATEGORY_INFO
    const catInfo = (typeof CATEGORY_INFO !== "undefined" && CATEGORY_INFO && CATEGORY_INFO[cat]) || null;
    if (catInfo && catInfo.detail && Array.isArray(catInfo.detail) && catInfo.detail.length > 0) {
      const sec = document.createElement("div");
      sec.className = "modal-section";
      const ul = document.createElement("ul");
      ul.className = "modal-detail-list";
      catInfo.detail.forEach(item => {
        const li = document.createElement("li");
        li.className = "modal-detail-item";
        const lb = document.createElement("span");
        lb.className = "modal-detail-label";
        lb.textContent = item.label;
        const tx = document.createElement("span");
        tx.className = "modal-detail-text";
        tx.textContent = item.text;
        li.appendChild(lb);
        li.appendChild(tx);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      modalBody.appendChild(sec);
    }

    // GAS版だけ：internal を「社内向け」の見出しの下に
    if (typeof VARIANT !== "undefined" && VARIANT === "gas" && catInfo && catInfo.internal && Array.isArray(catInfo.internal) && catInfo.internal.length > 0) {
      const sec = document.createElement("div");
      sec.className = "modal-section modal-internal-section";
      const title = document.createElement("div");
      title.className = "modal-section-title";
      title.textContent = "社内向け";
      sec.appendChild(title);
      const ul = document.createElement("ul");
      ul.className = "modal-detail-list";
      catInfo.internal.forEach(item => {
        const li = document.createElement("li");
        li.className = "modal-detail-item";
        const lb = document.createElement("span");
        lb.className = "modal-detail-label";
        lb.textContent = item.label;
        const tx = document.createElement("span");
        tx.className = "modal-detail-text";
        tx.textContent = item.text;
        li.appendChild(lb);
        li.appendChild(tx);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      modalBody.appendChild(sec);
    }

    // その項目の、今日以降の日程の一覧（やめた予定は斜線と理由つきで含める）
    const upcoming = evs.filter(e => e.category === cat && e.date >= today);
    const sec = document.createElement("div");
    sec.className = "modal-section";
    const title = document.createElement("div");
    title.className = "modal-section-title";
    title.textContent = "今日以降の日程（" + upcoming.length + "件）";
    sec.appendChild(title);

    if (upcoming.length === 0) {
      const p = document.createElement("p");
      p.style.margin = "0";
      p.style.color = "var(--muted)";
      p.textContent = "この先の予定はありません";
      sec.appendChild(p);
    } else {
      const ul = document.createElement("ul");
      ul.className = "modal-sublist";
      upcoming.forEach(e => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "modal-list-btn" + (e.omitted ? " omitted" : "");

        const d = new Date(e.date + "T00:00:00Z");
        const dtSpan = document.createElement("span");
        dtSpan.style.fontWeight = "700";
        dtSpan.textContent = (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + "（" + WD[d.getUTCDay()] + "）";
        btn.appendChild(dtSpan);

        const w = document.createElement("div");
        w.style.minWidth = "0";
        if (e.start) {
          const tm = document.createElement("span");
          tm.className = "time";
          tm.textContent = e.start + "〜" + (e.end || "");
          w.appendChild(tm);
        }
        const tit = document.createElement("span");
        tit.className = "modal-btn-title";
        tit.textContent = e.title;
        w.appendChild(tit);
        if (e.check) {
          const chk = document.createElement("span");
          chk.className = "check";
          chk.textContent = "確認中";
          w.appendChild(chk);
        }
        if (e.omitted && e.omitReason) {
          const r = document.createElement("div");
          r.className = "reason";
          r.textContent = "やめた理由：" + e.omitReason;
          w.appendChild(r);
        }
        btn.appendChild(w);

        btn.addEventListener("click", () => {
          openEventDetail(e, triggerEl);
        });
        li.appendChild(btn);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    }
    modalBody.appendChild(sec);

    openModal(triggerEl);
  }

  // 次の予定（今日以降・やめていないもの）
  const nextBtn = document.getElementById("next");
  const nxt = evs.find(e => e.date >= today && !e.omitted);
  if (nxt && nextBtn) {
    // 日付の文字列（日本の日付）から、端末の時間帯に関係なく月・日・曜日を出す（UTCの0時として扱い getUTC* で読む）
    const d = new Date(nxt.date + "T00:00:00Z");
    const md = (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + "（" + WD[d.getUTCDay()] + "）";
    const sameDay = evs.filter(e => e.date === nxt.date && !e.omitted);
    document.getElementById("nextBody").textContent = md + "　" + nxt.title + (nxt.start ? "　" + nxt.start + "〜" + (nxt.end || "") : "");
    const days = Math.round((d - new Date(today + "T00:00:00Z")) / 86400000);
    document.getElementById("nextSub").textContent = (days === 0 ? "今日" : days === 1 ? "明日" : "あと" + days + "日") +
      (sameDay.length > 1 ? "　／　同じ日にあと" + (sameDay.length - 1) + "件" : "");
    nextBtn.hidden = false;
    nextBtn.addEventListener("click", () => {
      openEventDetail(nxt, nextBtn);
    });
  }

  // 項目ごとの次の日程（今日以降・やめていないもの）を箱で並べる
  const nbGrid = document.getElementById("nbGrid");
  Object.keys(TAG).forEach(cat => {
    const upcoming = evs.filter(e => e.category === cat && e.date >= today && !e.omitted);
    const box = document.createElement("button");
    box.type = "button";
    box.className = "nb-box" + (upcoming.length ? "" : " none");
    box.addEventListener("click", () => {
      openCategoryDetail(cat, box);
    });
    const [label, cls] = TAG[cat];
    const tag = document.createElement("span"); tag.className = "tag " + cls; tag.textContent = label; box.appendChild(tag);
    const dt = document.createElement("div"); dt.className = "nb-date";
    if (!upcoming.length) {
      dt.textContent = "この先の予定はありません";
      box.appendChild(dt);
    } else {
      const e = upcoming[0];
      const d = new Date(e.date + "T00:00:00Z");
      dt.textContent = (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + "（" + WD[d.getUTCDay()] + "）";
      box.appendChild(dt);
      if (e.start) { const tm = document.createElement("div"); tm.className = "nb-time"; tm.textContent = e.start + "〜" + (e.end || ""); box.appendChild(tm); }
      const nm = document.createElement("div"); nm.className = "nb-name"; nm.textContent = e.title;
      if (e.check) { const k = document.createElement("span"); k.className = "check"; k.textContent = "確認中"; nm.appendChild(k); }
      box.appendChild(nm);
      const days = Math.round((d - new Date(today + "T00:00:00Z")) / 86400000);
      const sub = document.createElement("div"); sub.className = "nb-sub";
      sub.textContent = (days === 0 ? "今日" : days === 1 ? "明日" : "あと" + days + "日") + "　／　この先 " + upcoming.length + "件";
      box.appendChild(sub);
    }
    nbGrid.appendChild(box);
  });

  const byMonth = new Map();
  evs.forEach(e => {
    const m = e.date.slice(0, 7);
    if (!byMonth.has(m)) byMonth.set(m, new Map());
    const days = byMonth.get(m);
    if (!days.has(e.date)) days.set(e.date, []);
    days.get(e.date).push(e);
  });

  const root = document.getElementById("months");
  for (const [ym, days] of byMonth) {
    const [y, m] = ym.split("-").map(Number);
    const sec = document.createElement("section");
    sec.className = "month";
    sec.id = "m" + ym.replace("-", "");
    const h2 = document.createElement("h2");
    const live = [...days.values()].flat().filter(e => !e.omitted).length;
    h2.textContent = y + "年" + m + "月";
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = live + "件";
    h2.appendChild(c);
    sec.appendChild(h2);

    const box = document.createElement("div");
    box.className = "days";
    for (const [date, list] of days) {
      const d = new Date(date + "T00:00:00Z");
      const wd = d.getUTCDay();
      const row = document.createElement("div");
      row.className = "day" + (wd === 6 ? " sat" : wd === 0 ? " sun" : "") + (date === today ? " today" : date < today ? " past" : "");
      const dc = document.createElement("div");
      dc.className = "date";
      dc.textContent = m + "/" + d.getUTCDate();
      const w = document.createElement("span");
      w.className = "wd";
      w.textContent = WD[wd] + "曜";
      dc.appendChild(w);
      row.appendChild(dc);

      const ul = document.createElement("ul");
      ul.className = "events";
      for (const e of list) {
        const li = document.createElement("li");
        li.className = "ev-item";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ev" + (e.omitted ? " omitted" : "");
        const [label, cls] = TAG[e.category] || [e.category, "t-ev"];
        const tag = document.createElement("span");
        tag.className = "tag " + cls;
        tag.textContent = label;
        btn.appendChild(tag);

        const what = document.createElement("div");
        what.className = "what";
        if (e.start) {
          const t = document.createElement("span");
          t.className = "time";
          t.textContent = e.start + "〜" + (e.end || "");
          what.appendChild(t);
        }
        const ti = document.createElement("span");
        ti.className = "title";
        ti.textContent = e.title;
        what.appendChild(ti);
        if (e.check) {
          const k = document.createElement("span");
          k.className = "check";
          k.textContent = "確認中";
          what.appendChild(k);
        }
        btn.appendChild(what);

        if (e.omitted && e.omitReason) {
          const r = document.createElement("div");
          r.className = "reason";
          r.textContent = "やめた理由：" + e.omitReason;
          btn.appendChild(r);
        }

        btn.addEventListener("click", () => {
          openEventDetail(e, btn);
        });

        li.appendChild(btn);
        ul.appendChild(li);
      }
      row.appendChild(ul);
      box.appendChild(row);
    }
    sec.appendChild(box);
    root.appendChild(sec);
  }
})();
</script>
</body>
</html>
